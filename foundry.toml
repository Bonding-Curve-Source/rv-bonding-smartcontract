[profile.default]
src = "contracts"
test = "test/foundry"
out = "forge-out"
libs = ["node_modules", "lib"]
cache_path = "cache-forge"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "paris"

[profile.default.fuzz]
runs = 256
max_test_rejects = 100_000

[profile.default.invariant]
runs = 256
depth = 15

[profile.ci.fuzz]
runs = 5000
